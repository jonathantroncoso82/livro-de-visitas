services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-museum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-museum_pass}
      POSTGRES_DB: ${DB_NAME:-museum_db}
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - museum-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_USER: ${DB_USER:-museum_user}
      DB_PASSWORD: ${DB_PASSWORD:-museum_pass}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-museum_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - museum-network

volumes:
  postgres_data:

networks:
  museum-network:
    driver: bridge
